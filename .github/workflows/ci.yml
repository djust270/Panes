name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Lint
        run: |
          brew install swiftlint
          swiftlint --strict

      - name: Build
        run: swift build

      - name: Test
        run: scripts/test.sh
        env:
          EXPLORER_PERF_TESTS: "1"

      - name: Bundle (ad-hoc signed)
        run: scripts/bundle.sh
